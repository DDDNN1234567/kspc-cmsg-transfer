name: fix-source
on:
  push:
    paths:
      - '.github/workflows/fix-source.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch missing parenthesis
        run: |
          python - <<'PY'
          p = '源码/kpsc_to_cmsg.py'
          s = open(p, encoding='utf-8').read()
          bad = '"折扣:" + str(n(r.get("LowDiscount"))),'
          good = '"折扣:" + str(n(r.get("LowDiscount")))),'
          if bad not in s:
              raise SystemExit('pattern not found')
          s = s.replace(bad, good, 1)
          open(p, 'w', encoding='utf-8', newline='').write(s)
          print('patched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 源码/kpsc_to_cmsg.py
          git commit -m "fix: 补全 Employee Comment 括号"
          git push
